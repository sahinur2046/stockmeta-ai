<script>

const MODEL = "gemini-2.5-flash";

const MAX_IMAGES = 500;

/*
  একসাথে সর্বোচ্চ ২টি image
*/
const CONCURRENCY = 2;

/*
  API key cooldown
  Rate limit হলে অন্তত 20 sec অন্য key ব্যবহার করবে।
*/
const KEY_COOLDOWN_MS = 20000;


/* =========================
   GLOBAL STATE
========================= */

let images = [];

let apiKeys = [""];

let editingIndex = null;

let exportDirectoryHandle = null;

/*
  API KEY ROTATION STATE

  প্রতিটি key-এর জন্য:
  busy         = বর্তমানে request চলছে কিনা
  cooldownUntil = কতক্ষণ পর্যন্ত key ব্যবহার না করা হবে
  lastUsed     = সর্বশেষ কখন ব্যবহার হয়েছে
  disabled     = key invalid হলে সাময়িকভাবে বাদ
*/
let keyStates = [];

let rotationCursor = 0;


/* =========================
   ELEMENTS
========================= */

const fileInput =
  document.getElementById("fileInput");

const uploadBox =
  document.getElementById("uploadBox");

const grid =
  document.getElementById("grid");

const emptyState =
  document.getElementById("emptyState");

const counter =
  document.getElementById("counter");


/* =========================
   INIT
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadSettings();

    syncKeyStates();

    renderApiKeys();

    updateUI();

  }
);


/* =========================
   FILE PICKER
========================= */

function openFilePicker(){

  fileInput.click();

}


fileInput.addEventListener(
  "change",
  event => {

    handleFiles(event.target.files);

    fileInput.value = "";

  }
);


/* =========================
   DRAG DROP
========================= */

uploadBox.addEventListener(
  "dragover",
  e => {

    e.preventDefault();

    uploadBox.classList.add("drag");

  }
);


uploadBox.addEventListener(
  "dragleave",
  () => {

    uploadBox.classList.remove("drag");

  }
);


uploadBox.addEventListener(
  "drop",
  e => {

    e.preventDefault();

    uploadBox.classList.remove("drag");

    handleFiles(e.dataTransfer.files);

  }
);


/* =========================
   HANDLE FILES
========================= */

function handleFiles(fileList){

  const files =
    Array.from(fileList);

  if(!files.length)
    return;


  const remaining =
    MAX_IMAGES - images.length;


  if(remaining <= 0){

    alert(
      `Maximum ${MAX_IMAGES} images allowed.`
    );

    return;

  }


  const selected =
    files.slice(0, remaining);


  selected.forEach(file => {

    if(
      !file.type.match(
        /^image\/(png|jpeg|jpg|webp)$/i
      )
    ){

      return;

    }


    const url =
      URL.createObjectURL(file);


    images.push({

      file,

      url,

      name:file.name,

      status:"waiting",

      metadata:null,

      error:""

    });

  });


  if(files.length > remaining){

    alert(
      `Only ${MAX_IMAGES} images are allowed.`
    );

  }


  updateUI();

}


/* =========================
   UPDATE UI
========================= */

function updateUI(){

  counter.textContent =
    `${images.length} / ${MAX_IMAGES} images`;


  emptyState.style.display =
    images.length
      ? "none"
      : "block";


  renderCards();

}


/* =========================
   RENDER CARDS
========================= */

function renderCards(){

  grid.innerHTML = "";


  images.forEach((item,index) => {

    const card =
      document.createElement("div");


    card.className = "card";


    const statusClass =
      item.status === "loading"
        ? "loading"
        : item.status === "success"
        ? "success"
        : item.status === "error"
        ? "error"
        : "";


    let metadataHTML = "";


    if(item.metadata){

      const m =
        item.metadata;


      metadataHTML = `

        <div class="meta show">

          <div class="meta-item">

            <div class="meta-label">
              Title
            </div>

            <div class="meta-value">
              ${escapeHTML(m.title || "")}
            </div>

          </div>


          <div class="meta-item">

            <div class="meta-label">
              Description
            </div>

            <div class="meta-value">
              ${escapeHTML(m.description || "")}
            </div>

          </div>


          <div class="meta-item">

            <div class="meta-label">
              Keywords
            </div>

            <div class="keywords">

              ${(m.keywords || [])
                .map(k => `
                  <span class="keyword">
                    ${escapeHTML(k)}
                  </span>
                `)
                .join("")}

            </div>

          </div>


          <div class="meta-item">

            <div class="meta-label">
              Category
            </div>

            <div class="meta-value">
              ${escapeHTML(m.category || "")}
            </div>

          </div>

        </div>

      `;

    }


    let errorHTML = "";


    if(
      item.status === "error" &&
      item.error
    ){

      errorHTML = `

        <div
          style="
            color:#ff7777;
            font-size:11px;
            line-height:1.5;
            margin-top:7px;
          "
        >
          ${escapeHTML(item.error)}
        </div>

      `;

    }


    card.innerHTML = `

      <img
        class="card-image"
        src="${item.url}"
        alt=""
      >


      <div class="card-body">

        <div class="card-name">
          ${escapeHTML(item.name)}
        </div>


        <div class="status ${statusClass}">
          ${getStatusText(item.status)}
        </div>


        ${errorHTML}


        ${metadataHTML}


        <div class="card-actions">

          ${
            item.metadata

            ?

            `

            <button
              class="btn"
              onclick="editMetadata(${index})"
            >
              ✏ Edit
            </button>


            <button
              class="btn"
              onclick="copyMetadata(${index})"
            >
              📋 Copy
            </button>

            `

            :

            `

            <button
              class="btn"
              onclick="generateOne(${index})"
            >
              ✨ Generate
            </button>


            <button
              class="btn"
              onclick="removeImage(${index})"
            >
              🗑 Remove
            </button>

            `

          }

        </div>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* =========================
   STATUS
========================= */

function getStatusText(status){

  if(status === "loading")
    return "⏳ Generating...";


  if(status === "success")
    return "✓ Metadata generated";


  if(status === "error")
    return "✕ Generation failed";


  return "Ready — click Generate";

}


/* =========================================================
   API KEY ROTATION SYSTEM
========================================================= */


/*
  API key list পরিবর্তন হলে state sync করবে।
*/
function syncKeyStates(){

  const cleanKeys =
    apiKeys
      .map(k => k.trim())
      .filter(Boolean);


  const oldStates =
    keyStates.slice();


  keyStates =
    cleanKeys.map(
      (key,index) => {

        const old =
          oldStates[index];


        return {

          key,

          busy:
            old?.busy || 0,

          cooldownUntil:
            old?.cooldownUntil || 0,

          lastUsed:
            old?.lastUsed || 0,

          disabled:
            old?.disabled || false

        };

      }
    );


  if(
    rotationCursor >= keyStates.length
  ){

    rotationCursor = 0;

  }

}


/*
  Available key খুঁজে বের করবে।

  যে key:
  - busy না
  - cooldown-এ নেই
  - disabled না

  তার মধ্যে rotation অনুযায়ী ব্যবহার করবে।
*/
function acquireApiKey(excluded = new Set()){

  syncKeyStates();


  const now =
    Date.now();


  if(!keyStates.length){

    return null;

  }


  for(
    let i = 0;
    i < keyStates.length;
    i++
  ){

    const index =
      (
        rotationCursor + i
      ) %
      keyStates.length;


    const state =
      keyStates[index];


    if(!state)
      continue;


    if(
      excluded.has(index)
    )
      continue;


    if(
      state.busy > 0
    )
      continue;


    if(
      state.disabled
    )
      continue;


    if(
      state.cooldownUntil > now
    )
      continue;


    state.busy++;

    state.lastUsed =
      now;


    rotationCursor =
      (
        index + 1
      ) %
      keyStates.length;


    return {

      index,

      key:
        state.key

    };

  }


  return null;

}


/*
  Request শেষ হলে key release করবে।
*/
function releaseApiKey(index){

  const state =
    keyStates[index];


  if(!state)
    return;


  state.busy =
    Math.max(
      0,
      state.busy - 1
    );

}


/*
  Rate limit / temporary server error হলে
  key-কে কিছু সময় cooldown-এ রাখবে।
*/
function cooldownApiKey(
  index,
  milliseconds = KEY_COOLDOWN_MS
){

  const state =
    keyStates[index];


  if(!state)
    return;


  state.cooldownUntil =
    Date.now() +
    milliseconds;

}


/*
  Invalid API key হলে সাময়িকভাবে disable।
*/
function disableApiKey(index){

  const state =
    keyStates[index];


  if(!state)
    return;


  state.disabled = true;

}


/*
  API key-এর error দেখে সিদ্ধান্ত।
*/
function handleApiKeyError(
  index,
  error
){

  const message =
    String(
      error?.message || ""
    ).toLowerCase();


  /*
    429 = Too Many Requests
    quota / resource exhausted
  */
  if(
    message.includes("429") ||
    message.includes("quota") ||
    message.includes("resource_exhausted") ||
    message.includes("rate limit")
  ){

    cooldownApiKey(
      index,
      KEY_COOLDOWN_MS
    );

    return;

  }


  /*
    503 = overloaded
    500 = temporary server error
  */
  if(
    message.includes("503") ||
    message.includes("500") ||
    message.includes("overloaded")
  ){

    cooldownApiKey(
      index,
      15000
    );

    return;

  }


  /*
    400/401/403 সাধারণত key/configuration
    problem হতে পারে।

    403 হলে permanent delete করছি না,
    শুধু কিছু সময়ের জন্য disable করছি।
  */
  if(
    message.includes("401") ||
    message.includes("403") ||
    message.includes("api key")
  ){

    const state =
      keyStates[index];


    if(state){

      state.disabled =
        true;

    }

  }

}


/*
  সব key busy/cooldown হলে
  সবচেয়ে কাছের available key পর্যন্ত wait করবে।
*/
async function waitForAvailableKey(){

  while(true){

    const keys =
      getSessionKeys();


    if(!keys.length)
      return null;


    const available =
      acquireApiKey();


    if(available)
      return available;


    const now =
      Date.now();


    let waitTime =
      3000;


    const futureTimes =
      keyStates
        .filter(
          state =>
            !state.disabled &&
            state.cooldownUntil > now &&
            state.busy === 0
        )
        .map(
          state =>
            state.cooldownUntil
        );


    if(futureTimes.length){

      const earliest =
        Math.min(
          ...futureTimes
        );


      waitTime =
        Math.max(
          1000,
          Math.min(
            5000,
            earliest - now
          )
        );

    }


    /*
      যদি সব key disabled হয়ে যায়
    */
    const usable =
      keyStates.some(
        state =>
          !state.disabled
      );


    if(!usable){

      return null;

    }


    await sleep(
      waitTime
    );

  }

}


/* =========================
   SLEEP
========================= */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================
   GEMINI API
========================= */

async function callGemini(
  file,
  key
){

  const base64 =
    await fileToBase64(file);


  const prompt =
    buildPrompt();


  const endpoint =
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(key)}`;


  const response =
    await fetch(
      endpoint,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          contents:[

            {

              parts:[

                {
                  text:prompt
                },

                {

                  inline_data:{

                    mime_type:file.type,

                    data:base64

                  }

                }

              ]

            }

          ],

          generationConfig:{

            temperature:0.4,

            responseMimeType:
              "application/json"

          }

        })

      }
    );


  if(!response.ok){

    const errorText =
      await response.text();


    throw new Error(
      `API ${response.status}: ${errorText}`
    );

  }


  const data =
    await response.json();


  const text =
    data
      ?.candidates?.[0]
      ?.content?.parts?.[0]
      ?.text;


  if(!text){

    throw new Error(
      "No response from Gemini."
    );

  }


  return parseJSON(text);

}


/* =========================
   PROMPT
========================= */

    document.getElementById(
      "stockSite"
    ).value;


  const titleStyle =
    document.getElementById(
      "titleStyle"
    ).value;


  const descriptionLength =
    document.getElementById(
      "descriptionLength"
    ).value;


  const keywordCount =
    Number(
      document.getElementById(
        "keywordCount"
      ).value
    ) || 35;


  const custom =
    document.getElementById(
      "customInstructions"
    ).value.trim();


  return `

You are an expert stock photography metadata specialist.

Analyze the uploaded image carefully.

Generate metadata suitable for ${stock}.

TITLE:
Use ${titleStyle} title style.
Make it natural, accurate, searchable and commercially useful.
Do not use unnecessary promotional words.

DESCRIPTION:
Write a ${descriptionLength} stock image description.

KEYWORDS:
Generate exactly ${keywordCount} relevant keywords.
Use single words or short useful phrases.
Prioritize important visual concepts first.
Avoid duplicates.
Avoid irrelevant keywords.
Do not keyword spam.

CATEGORY:
Choose the most suitable stock category.

IMPORTANT:
Do not invent objects, people, locations or concepts that are not visible.
Return ONLY valid JSON.

JSON format:

{
  "title": "string",
  "description": "string",
  "keywords": ["keyword1", "keyword2"],
  "category": "string"
}

Additional instructions:
${custom || "None"}

`;

}


/* =========================================================
   GENERATE ALL
========================================================= */

async function generateAll(){

  if(!images.length){

    alert(
      "Please upload at least one image first."
    );

    return;

  }


  const keys =
    getSessionKeys();


  if(!keys.length){

    alert(
      "Please add a Gemini 2.5 Flash API key in Settings."
    );

    openSettings();

    return;

  }


  const pending =
    images
      .map(
        (item,index) => ({
          item,
          index
        })
      )
      .filter(
        x =>
          x.item.status !== "loading" &&
          !x.item.metadata
      );


  if(!pending.length){

    alert(
      "All images already have metadata."
    );

    return;

  }


  const button =
    document.getElementById(
      "generateAllBtn"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ Generating 0 / " +
    pending.length;


  let completed =
    0;


  try{

    /*
      সর্বোচ্চ ২টি image একসাথে।
    */

    for(
      let i = 0;
      i < pending.length;
      i += CONCURRENCY
    ){

      const batch =
        pending.slice(
          i,
          i + CONCURRENCY
        );


      await Promise.all(

        batch.map(
          x =>
            generateImage(
              x.index
            ).finally(
              () => {

                completed++;


                button.textContent =
                  `⏳ Generating ${completed} / ${pending.length}`;

              }
            )
        )

      );

    }

  }finally{

    button.disabled =
      false;


    button.textContent =
      "✨ Generate Metadata";


    updateUI();

  }

}


/* =========================================================
   GENERATE ONE
========================================================= */

async function generateOne(index){

  const keys =
    getSessionKeys();


  if(!keys.length){

    alert(
      "Please add a Gemini 2.5 Flash API key in Settings."
    );

    openSettings();

    return;

  }


  await generateImage(
    index
  );


  updateUI();

}


/* =========================================================
   GENERATE IMAGE
========================================================= */

async function generateImage(index){

  const item =
    images[index];


  if(!item)
    return;


  item.status =
    "loading";


  item.error =
    "";


  renderCards();


  const keys =
    getSessionKeys();


  if(!keys.length){

    item.status =
      "error";

    item.error =
      "No API keys available.";

    renderCards();

    return;

  }


  /*
    এই image-এর জন্য কোন key ইতিমধ্যে
    চেষ্টা করা হয়েছে।
  */
  const attempted =
    new Set();


  let lastError =
    null;


  /*
    সর্বোচ্চ প্রতিটি available key
    একবার করে চেষ্টা করবে।
  */
  for(
    let attempt = 0;
    attempt < keys.length;
    attempt++
  ){

    let acquired =
      await waitForSpecificAvailableKey(
        attempted
      );


    if(!acquired){

      break;

    }


    attempted.add(
      acquired.index
    );


    try{

      const metadata =
        await callGemini(
          item.file,
          acquired.key
        );


      item.metadata =
        normalizeMetadata(
          metadata
        );


      item.status =
        "success";


      item.error =
        "";


      releaseApiKey(
        acquired.index
      );


      renderCards();

      return;

    }catch(error){

      lastError =
        error;


      console.warn(
        `Gemini API key #${acquired.index + 1} failed:`,
        error
      );


      handleApiKeyError(
        acquired.index,
        error
      );


      releaseApiKey(
        acquired.index
      );


      renderCards();

    }

  }


  /*
    সব available key try করেও কাজ হয়নি।
  */

  item.status =
    "error";


  item.metadata =
    null;


  item.error =
    getFriendlyApiError(
      lastError
    );


  renderCards();

}


/*
  নির্দিষ্ট image-এর জন্য এমন key খুঁজবে
  যেটা আগে চেষ্টা করা হয়নি।
*/
async function waitForSpecificAvailableKey(
  attempted
){

  while(true){

    syncKeyStates();


    const now =
      Date.now();


    /*
      Rotation cursor থেকে search।
    */
    for(
      let i = 0;
      i < keyStates.length;
      i++
    ){

      const index =
        (
          rotationCursor + i
        ) %
        keyStates.length;


      const state =
        keyStates[index];


      if(!state)
        continue;


      if(
        attempted.has(index)
      )
        continue;


      if(
        state.busy > 0
      )
        continue;


      if(
        state.disabled
      )
        continue;


      if(
        state.cooldownUntil > now
      )
        continue;


      state.busy++;


      state.lastUsed =
        now;


      rotationCursor =
        (
          index + 1
        ) %
        keyStates.length;


      return {

        index,

        key:
          state.key

      };

    }


    /*
      নতুন key নেই।
    */
    const remaining =
      keyStates.some(
        (state,index) =>
          !attempted.has(index) &&
          !state.disabled
      );


    if(!remaining){

      return null;

    }


    /*
      Cooldown শেষ হওয়া পর্যন্ত
      অল্প অল্প করে wait।
    */

    let waitTime =
      1000;


    const future =
      keyStates
        .filter(
          (state,index) =>
            !attempted.has(index) &&
            !state.disabled &&
            state.cooldownUntil > now
        )
        .map(
          state =>
            state.cooldownUntil
        );


    if(future.length){

      waitTime =
        Math.max(
          1000,
          Math.min(
            5000,
            Math.min(...future) - now
          )
        );

    }


    await sleep(
      waitTime
    );

  }

}


/* =========================
   FRIENDLY API ERROR
========================= */

function getFriendlyApiError(
  error
){

  if(!error)
    return "All API keys failed.";


  const message =
    String(
      error.message || ""
    );


  if(
    message.includes("429") ||
    message.toLowerCase().includes("quota") ||
    message.toLowerCase().includes("resource_exhausted")
  ){

    return "All available API keys reached their current rate/quota limit.";

  }


  if(
    message.includes("403") ||
    message.includes("401")
  ){

    return "All available API keys were rejected. Check your API keys.";

  }


  if(
    message.includes("503") ||
    message.includes("500")
  ){

    return "Gemini server is temporarily unavailable.";

  }


  return message.substring(
    0,
    300
  );

}


/* =========================================================
   TEST API KEYS
========================================================= */

async function testApiKeys(){

  const keys =
    getSessionKeys();


  if(!keys.length){

    alert(
      "Please enter an API key first."
    );

    return;

  }


  let working =
    0;


  let failed =
    0;


  const results = [];


  for(
    let i = 0;
    i < keys.length;
    i++
  ){

    try{

      const response =
        await fetch(

          `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(keys[i])}`,

          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              contents:[

                {

                  parts:[

                    {
                      text:
                        "Reply with exactly: OK"
                    }

                  ]

                }

              ]

            })

          }

        );


      if(!response.ok){

        throw new Error(
          `API ${response.status}`
        );

      }


      working++;

      results.push(
        `Key ${i + 1}: ✓ Working`
      );


    }catch(error){

      failed++;

      results.push(
        `Key ${i + 1}: ✕ ${error.message}`
      );

    }

  }


  alert(

    `API Key Test Complete\n\n` +

    `✓ Working: ${working}\n` +

    `✕ Failed: ${failed}\n\n` +

    results.join("\n")

  );

  const completed =
    images.filter(
      item =>
        item.metadata
    );


  if(!completed.length){

    alert(
      "Generate metadata for at least one image first."
    );

    return;

  }


  const rows = [

    [
      "Filename",
      "Title",
      "Description",
      "Keywords",
      "Category"
    ]

  ];


  completed.forEach(
    item => {

      const m =
        item.metadata;


      rows.push([

        item.name,

        m.title || "",

        m.description || "",

        (m.keywords || [])
          .join(", "),

        m.category || ""

      ]);

    }
  );


  const csv =
    rows
      .map(
        row =>
          row
            .map(csvEscape)
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [
        "\uFEFF" + csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    "stockmeta-metadata.csv";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );

}

/* =========================
   XML ESCAPE
========================= */

function escapeXML(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&apos;"
    );

}

    escapeXML(

      metadata.description || ""
    );


  const category =
    escapeXML(
      metadata.category || ""
    );


  const keywords =
    Array.isArray(
      metadata.keywords

      : [];


  const keywordXML =
    keywords
      .map(
        keyword =>
          `<rdf:li>${escapeXML(keyword)}</rdf:li>`
      )
      .join("");


  return `<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?>

<rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">

xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/">

<rdf:Alt>

</rdf:Alt>
</dc:title>

${keywordXML}
</rdf:Bag>

<xmp:CreatorTool>
StockMeta AI
</xmp:CreatorTool>

</rdf:Description>

</rdf:RDF>
</x:xmpmeta>
<?xpacket end="w"?>`;

}


/* =========================================================
   JPEG XMP
========================================================= */

function embedXMPIntoJPEG(
  arrayBuffer,
  xmp
){

  const original =
    new Uint8Array(
      arrayBuffer
    );


  if(
    original[0] !== 0xFF ||
    original[1] !== 0xD8
  ){

    throw new Error(
      "Invalid JPEG file."
    );

  }


  const header =
    new TextEncoder().encode(
      "http://ns.adobe.com/xap/1.0/\0"
    );


  const xmpBytes =
    new TextEncoder().encode(
      xmp
    );


  const data =
    new Uint8Array(
      header.length +
      xmpBytes.length
    );


  data.set(
    header,
    0
  );


  data.set(
    xmpBytes,
    header.length
  );


  const segmentLength =
    data.length + 2;


  if(
    segmentLength > 65535
  ){

    throw new Error(
      "Metadata is too large."
    );

  }


  const output =
    new Uint8Array(
      original.length +
      4 +
      data.length
    );


  output[0] =
    0xFF;


  output[1] =
    0xD8;


  output[2] =
    0xFF;


  output[3] =
    0xE1;


  output[4] =
    (segmentLength >> 8) &
    0xFF;


  output[5] =
    segmentLength &
    0xFF;


  output.set(
    data,
    6
  );


  output.set(
    original.slice(2),
    6 + data.length
  );


  return output.buffer;

}


/* =========================================================
   PNG
========================================================= */

function crc32(bytes){

  let crc =
    0xFFFFFFFF;


  for(
    let i = 0;
    i < bytes.length;
    i++
  ){

    crc ^=
      bytes[i];


    for(
      let j = 0;
      j < 8;
      j++
    ){

      crc =
        (crc >>> 1) ^
        (
          0xEDB88320 &
          -(crc & 1)
        );

    }

  }


  return (
    crc ^
    0xFFFFFFFF
  ) >>> 0;

}


function createPNGChunk(
  type,
  data
){

  const typeBytes =
    new TextEncoder().encode(
      type
    );


  const result =
    new Uint8Array(
      12 +
      data.length
    );


  const view =
    new DataView(
      result.buffer
    );


  view.setUint32(
    0,
    data.length
  );


  result.set(
    typeBytes,
    4
  );


  result.set(
    data,
    8
  );


  const crcData =
    new Uint8Array(
      typeBytes.length +
      data.length
    );


  crcData.set(
    typeBytes,
    0
  );


  crcData.set(
    data,
    typeBytes.length
  );


  view.setUint32(
    8 + data.length,
    crc32(crcData)
  );


  return result;

}


function embedXMPIntoPNG(
  arrayBuffer,
  xmp
){

  const original =
    new Uint8Array(
      arrayBuffer
    );


  const signature =
    original.slice(
      0,
      8
    );


  const expectedSignature =
    new Uint8Array([
      137,80,78,71,
      13,10,26,10
    ]);


  for(
    let i = 0;
    i < 8;
    i++
  ){

    if(
      signature[i] !==
      expectedSignature[i]
    ){

      throw new Error(
        "Invalid PNG file."
      );

    }

  }


  /*
    Correct PNG iTXt format:
    keyword + null +
    compression flag +
    compression method +
    language tag + null +
    translated keyword + null +
    XMP
  */

  const keyword =
    new TextEncoder().encode(
      "XML:com.adobe.xmp"
    );


  const xmpBytes =
    new TextEncoder().encode(
      xmp
    );


  const xmpData =
    new Uint8Array(
      keyword.length +
      1 +
      1 +
      1 +
      1 +
      1 +
      xmpBytes.length
    );


  let offset = 0;


  xmpData.set(
    keyword,
    offset
  );

  offset +=
    keyword.length;


  xmpData[offset++] =
    0;


  xmpData[offset++] =
    0;


  xmpData[offset++] =
    0;


  xmpData[offset++] =
    0;


  xmpData.set(
    xmpBytes,
    offset
  );


  const chunk =
    createPNGChunk(
      "iTXt",
      xmpData
    );


  let pos =
    8;


  let iendPosition =
    -1;


  while(
    pos + 12 <=
    original.length
  ){

    const view =
      new DataView(
        original.buffer,
        original.byteOffset +
          pos,
        4
      );


    const length =
      view.getUint32(
        0
      );


    const type =
      new TextDecoder().decode(
        original.slice(
          pos + 4,
          pos + 8
        )
      );


    if(
      type === "IEND"
    ){

      iendPosition =
        pos;

      break;

    }


    pos +=
      12 + length;

  }


  if(
    iendPosition === -1
  ){

    throw new Error(
      "Invalid PNG file."
    );

  }


  const output =
    new Uint8Array(
      original.length +
      chunk.length
    );


  output.set(
    original.slice(
      0,
      iendPosition
    ),
    0
  );


  output.set(
    chunk,
    iendPosition
  );


  output.set(
    original.slice(
      iendPosition
    ),
    iendPosition +
      chunk.length
  );


  return output.buffer;

}


/* =========================================================
   WEBP XMP
========================================================= */

function embedXMPIntoWEBP(
  arrayBuffer,
  xmp
){

  const original =
    new Uint8Array(
      arrayBuffer
    );


  const decoder =
    new TextDecoder();


  const riff =
    decoder.decode(
      original.slice(
        0,
        4
      )
    );


  const webp =
    decoder.decode(
      original.slice(
        8,
        12
      )
    );


  if(
    riff !== "RIFF" ||
    webp !== "WEBP"
  ){

    throw new Error(
      "Invalid WEBP file."
    );

  }


  const xmpBytes =
    new TextEncoder().encode(
      xmp
    );


  const padded =
    xmpBytes.length % 2 === 0
      ? xmpBytes.length
      : xmpBytes.length + 1;


  const chunk =
    new Uint8Array(
      8 + padded
    );


  const view =
    new DataView(
      chunk.buffer
    );


  chunk.set(
    new TextEncoder().encode(
      "XMP "
    ),
    0
  );


  view.setUint32(
    4,
    xmpBytes.length,
    true
  );


  chunk.set(
    xmpBytes,
    8
  );


  const oldSize =
    new DataView(
      original.buffer,
      original.byteOffset + 4,
      4
    ).getUint32(
      0,
      true
    );


  const output =
    new Uint8Array(
      original.length +
      chunk.length
    );


  output.set(
    original,
    0
  );


  output.set(
    chunk,
    original.length
  );


  const outputView =
    new DataView(
      output.buffer
    );


  outputView.setUint32(
    4,
    oldSize +
      chunk.length,
    true
  );


  return output.buffer;

}


/* =========================================================
   IMAGE WITH METADATA
========================================================= */

async function createImageWithMetadata(
  item
){

  const originalBuffer =
    await item.file.arrayBuffer();


  const xmp =
    createXMP(
      item.metadata
    );


  const type =
    (
      item.file.type ||
      ""
    ).toLowerCase();


  if(
    type === "image/jpeg" ||
    type === "image/jpg"
  ){

    return new Blob(

      [
        embedXMPIntoJPEG(
          originalBuffer,
          xmp
        )
      ],

      {
        type:"image/jpeg"
      }

    );

  }


  if(
    type === "image/png"
  ){

    return new Blob(

      [
        embedXMPIntoPNG(
          originalBuffer,
          xmp
        )
      ],

      {
        type:"image/png"
      }

    );

  }


  if(
    type === "image/webp"
  ){

    return new Blob(

      [
        embedXMPIntoWEBP(
          originalBuffer,
          xmp
        )
      ],

      {
        type:"image/webp"
      }

    );

  }


  throw new Error(
    "Unsupported image format."
  );

}


/* =========================================================
   UNIQUE FILE NAME
========================================================= */

async function getUniqueFileName(
  directory,
  originalName
){

  const dot =
    originalName.lastIndexOf(".");


  const extension =
    dot >= 0
      ? originalName.slice(dot)
      : "";


  const base =
    dot >= 0
      ? originalName.slice(
          0,
          dot
        )
      : originalName;


  let candidate =
    originalName;


  let number =
    1;


  while(true){

    try{

      await directory.getFileHandle(
        candidate
      );


      candidate =
        `${base} (${number})${extension}`;


      number++;


    }catch(error){

      if(
        error.name ===
        "NotFoundError"
      ){

        return candidate;

      }


      throw error;

    }

  }

}


/* =========================================================
   EXPORT IMAGES + METADATA
========================================================= */

async function exportImagesWithMetadata(){

  if(
    !window.showDirectoryPicker
  ){

    alert(
      "Folder export is not supported by this browser.\n\n" +
      "Please use Google Chrome or Microsoft Edge."
    );

    return;

  }


  if(!exportDirectoryHandle){

    await selectExportFolder();


    if(!exportDirectoryHandle)
      return;

  }


  const completed =
    images.filter(
      item =>
        item.metadata &&
        item.status === "success"
    );


  if(!completed.length){

    alert(
      "Generate metadata for at least one image first."
    );

    return;

  }


  const button =
    document.getElementById(
      "folderExportBtn"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ Exporting...";


  let exported =
    0;


  try{

    for(
      const item of completed
    ){

      const blob =
        await createImageWithMetadata(
          item
        );


      const fileName =
        await getUniqueFileName(
          exportDirectoryHandle,
          item.name
        );


      const fileHandle =
        await exportDirectoryHandle.getFileHandle(
          fileName,
          {
            create:true
          }
        );


      const writable =
        await fileHandle.createWritable();


      await writable.write(
        blob
      );


      await writable.close();


      exported++;

    }


    document.getElementById(
      "exportFolderStatus"
    ).textContent =
      `✓ ${exported} image(s) exported to ${exportDirectoryHandle.name}`;


    alert(

      `✓ Export complete!\n\n` +

      `${exported} image(s) exported.\n\n` +

      `Title, Description, Keywords and Category ` +

      `were embedded inside the image files.`

    );


  }catch(error){

    console.error(
      error
    );


    alert(
      "✕ Export failed.\n\n" +
      error.message
    );


  }finally{

    button.disabled =
      false;


    button.textContent =
      "📁 Export Images + Metadata";

  }

}


/* =========================
   BASE64
========================= */

function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const result =
          reader.result;


        const base64 =
          result.split(",")[1];


        resolve(
          base64
        );

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   JSON PARSER
========================= */

function parseJSON(text){

  let cleaned =
    text.trim();


  cleaned =
    cleaned.replace(
      /^```json/i,
      ""
    );


  cleaned =
    cleaned.replace(
      /^```/,
      ""
    );


  cleaned =
    cleaned.replace(
      /```$/,
      ""
    );


  cleaned =
    cleaned.trim();


  try{

    return JSON.parse(
      cleaned
    );

  }catch{

    const start =
      cleaned.indexOf(
        "{"
      );


    const end =
      cleaned.lastIndexOf(
        "}"
      );


    if(
      start !== -1 &&
      end !== -1
    ){

      return JSON.parse(
        cleaned.slice(
          start,
          end + 1
        )
      );

    }


    throw new Error(
      "Invalid JSON returned by Gemini."
    );

  }

}


/* =========================
   NORMALIZE METADATA
========================= */

function normalizeMetadata(data){

  return {

    title:
      String(
        data.title || ""
      ),

    description:
      String(
        data.description || ""
      ),

    keywords:
      Array.isArray(
        data.keywords
      )

        ?

        data.keywords
          .map(
            k =>
              String(k).trim()
          )
          .filter(Boolean)

        :

        [],

    category:
      String(
        data.category || ""
      )

  };

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  );

}
